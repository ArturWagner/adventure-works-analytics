version: '3.8'

x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__SECRET_KEY: ${AIRFLOW__CORE__SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:15
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 5
      timeout: 5s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file: .env
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./data/AdventureWorks2022.bak:/var/opt/mssql/backup/aw.bak
      - ./scripts/entrypoint-sqlserver.sh:/entrypoint-sqlserver.sh
    entrypoint: ["/bin/bash", "/entrypoint-sqlserver.sh"]
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa",
             "-P", "${MSSQL_SA_PASSWORD}", "-Q",
             "SELECT name FROM sys.databases WHERE name='AdventureWorks2022'"]
      interval: 10s
      retries: 10
      timeout: 10s

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db init &&
               airflow users create
                 --username ${_AIRFLOW_WWW_USER_USERNAME}
                 --password ${_AIRFLOW_WWW_USER_PASSWORD}
                 --firstname Admin --lastname User
                 --role Admin --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy
      sqlserver:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
      timeout: 10s

volumes:
  postgres-data:
